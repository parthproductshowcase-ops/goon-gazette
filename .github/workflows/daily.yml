name: The Goon Gazette
on:
  schedule:
    # 5:00am ET, full paper. GitHub runs scheduled jobs late on this repo (often by hours, worst at the
    # top of the hour), so several firings are listed at off-hour minutes. The gate below builds on the
    # first firing that lands at 5am ET, or on any later firing if today's paper still isn't out.
    - cron: "7 9 * * *"     # 5:07am EDT (4:07am EST)
    - cron: "7 10 * * *"    # 5:07am EST (6:07am EDT)
    - cron: "7 11 * * *"    # retries if the earlier firings came late or never came
    - cron: "7 12 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:        # "Run workflow" button for manual rebuilds (always runs)
permissions:
  contents: write
concurrency:
  group: gazette-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate (5am ET firing, or any firing while today's paper is missing)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          NOW=$(TZ=America/New_York date +%H:%M)
          M=$((10#${NOW%:*} * 60 + 10#${NOW#*:}))
          YDAY=$(TZ=America/New_York date -d 'yesterday' +%F)
          HAVE=$(python3 -c "import json;print(json.load(open('docs/data/edition.json')).get('date',''))" 2>/dev/null || echo "")
          if [ "$HAVE" = "$YDAY" ]; then
            echo "Paper for $YDAY is already out ($NOW ET); skipping"; echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$M" -ge 300 ] && [ "$M" -lt 360 ]; then
            echo "5am ET window ($NOW); building"; echo "go=yes" >> "$GITHUB_OUTPUT"
          elif [ "$M" -ge 300 ]; then
            echo "Late firing ($NOW ET) and paper for $YDAY not out yet (have '$HAVE'); building"; echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Before 5am ET ($NOW); skipping"; echo "go=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'yes'
      - run: python -m pipeline.history   # cheap: only fetches seasons not yet archived
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true   # a history hiccup never blocks the daily paper
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python -m pipeline.build
        if: steps.gate.outputs.go == 'yes'
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit today's paper
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "gazette-bot"
          git config user.email "gazette-bot@users.noreply.github.com"
          git add docs/data docs/cards archive cache labs
          git diff --cached --quiet || git commit -m "Gazette $(TZ=America/New_York date +%F)"
          git pull --rebase --autostash
          git push
      - name: Record the failure in status.json (the site footer and the daily check read it)
        if: failure() && steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "gazette-bot"
          git config user.email "gazette-bot@users.noreply.github.com"
          test -f docs/data/status.json || echo '{"ok": false, "edition": "morning", "error": "build failed before status.json was written"}' > docs/data/status.json
          git add docs/data/status.json
          git diff --cached --quiet || git commit -m "Gazette build failed $(TZ=America/New_York date +%F)"
          git pull --rebase --autostash
          git push

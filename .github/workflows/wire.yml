name: The Wire data
# Free agents (Yahoo), injuries, box-score minutes and the 21-day schedule (ESPN) into cache/wire.
# Runs right after the morning paper; also by hand. Raw data only; no rankings are published.
on:
  workflow_run:
    workflows: ["The Goon Gazette"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gazette-build
  cancel-in-progress: false
jobs:
  wire:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pipeline.wire
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
      - name: Commit the wire data
        run: |
          git config user.name "gazette-bot"
          git config user.email "gazette-bot@users.noreply.github.com"
          git add cache/wire
          git diff --cached --quiet || git commit -m "Wire data $(TZ=America/New_York date +%F)"
          git pull --rebase --autostash
          git push

name: The Lineup Card
on:
  schedule:
    # Two editions a night, each with an EDT line and an EST line so the clock change changes nothing.
    # 7:15pm ET: the Lineup Card (23:15 UTC in EDT, 00:15 UTC in EST)
    - cron: "15 23 * * *"
    - cron: "15 0 * * *"
    # 10:45pm ET: the late edition, most finals in (02:45 UTC in EDT, 03:45 UTC in EST)
    - cron: "45 2 * * *"
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: "card (7:15pm) or late (10:45pm)"
        default: "card"
        type: choice
        options: [card, late]
permissions:
  contents: write
concurrency:
  group: gazette-build
  cancel-in-progress: false
jobs:
  tonight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which edition is this, in Eastern time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "edition=${{ github.event.inputs.edition }}" >> "$GITHUB_OUTPUT"
          else
            M=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
            # 7:15pm to 8:14pm ET is the card; 10:45pm to 11:44pm ET is the late edition; anything else is the off-season clock
            if [ "$M" -ge 1155 ] && [ "$M" -lt 1215 ]; then echo "edition=card" >> "$GITHUB_OUTPUT";
            elif [ "$M" -ge 1365 ] && [ "$M" -lt 1425 ]; then echo "edition=late" >> "$GITHUB_OUTPUT";
            else echo "edition=skip" >> "$GITHUB_OUTPUT"; echo "Not an ET edition time ($(TZ=America/New_York date +%H:%M)); skipping"; fi
          fi
          # Until the official Yahoo feed opens, edition.json says sample or yahoo-web and there is nothing to pull.
          if python3 -c 'import json,sys; e=json.load(open("docs/data/edition.json")); sys.exit(0 if (e.get("sample") or e.get("source")=="yahoo-web") else 1)'; then
            echo "feed=closed" >> "$GITHUB_OUTPUT"; echo "Yahoo feed not open yet (edition.json is sample or yahoo-web); skipping"
          else
            echo "feed=open" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.edition != 'skip' && steps.gate.outputs.feed == 'open'
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.edition != 'skip' && steps.gate.outputs.feed == 'open'
      - run: python -m pipeline.tonight
        if: steps.gate.outputs.edition != 'skip' && steps.gate.outputs.feed == 'open'
        env:
          GG_EDITION: ${{ steps.gate.outputs.edition }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit tonight's card
        if: steps.gate.outputs.edition != 'skip' && steps.gate.outputs.feed == 'open'
        run: |
          git config user.name "gazette-bot"
          git config user.email "gazette-bot@users.noreply.github.com"
          git add docs/data/tonight.json
          git diff --cached --quiet || git commit -m "Lineup Card (${{ steps.gate.outputs.edition }}) $(TZ=America/New_York date +%F)"
          git pull --rebase
          git push

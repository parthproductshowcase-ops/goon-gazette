  hero() {
    // a goon from common.js, placed and posed inside the scene

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const CN = {"5": "FG", "8": "FT", "10": "3PM", "11": "3P", "12": "PTS", "13": "OREB", "14": "DREB", "16": "AST", "17": "STL", "18": "BLK", "19": "TO"};
let X, C, T;

const nm = tk => esc(X.teams[tk]?.name || tk);
const mg = tk => esc(X.teams[tk]?.manager || "");
const md = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric"});
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const score = s => `${s[0]}-${s[1]}${s[2] ? "-" + s[2] : ""}`;
const txt = v => typeof v === "string" ? v : (v && v.text) || "";
const pinsOf = v => (v && typeof v === "object" && v.pins) || [];

// teams and managers bolded in any copy we print; players get highlighted in their pins, not the prose
function ink(t) {
  let h = esc(t || "");
  const keys = Object.values(X.teams).flatMap(t => [t.name, t.manager]).filter(Boolean).sort((a, b) => b.length - a.length);
  keys.forEach(k => {
    const e = esc(k).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    h = h.replace(new RegExp(`(^|[^\\w>])(${e})(?![\\w<])`, "g"), "$1<b>$2</b>");
  });
  return h;
}

// a stat pin: player name plus 1 to 3 numbers from the week (or the weekend), straight from the data
function pin(p) {
  if (typeof p === "string") p = {p};
  if (p.label) return `<span class="wx-pin plain">${esc(p.label)}</span>`;
  const e = (p.t && X.pins[`${p.p}|${p.t}`]) || X.pins[p.p];
  if (!e) return "";
  const l = p.w ? e.weekend : e.line;
  if (!l) return "";
  const cats = (p.c && p.c.length ? p.c : e.best).filter(c => l[c] != null).slice(0, 3);
  const vals = cats.map(c => Array.isArray(l[c]) ? `<i><b>${l[c][1]}-${l[c][2]}</b> ${CN[c]}</i>` : `<i><b>${l[c]}</b> ${CN[c]}</i>`).join("");
  const who = p.t && p.t !== e.team ? ` <small>for ${nm(p.t)}</small>` : "";
  return `<span class="wx-pin"><mark>${esc(p.p)}</mark>${who}${vals}<em>${p.w ? "Sat-Sun" : (e.games + (e.games === 1 ? " game" : " games"))}</em></span>`;
}
const pins = list => (list || []).map(pin).join("");

const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const DEFAULT_CHAPTERS = ["intro", "wanted", "results", "late", "boot", "roy", "saloon"];
const BLOCK = {
  // Wanted posters
  wanted() {
    const W = C.wanted || {}, art = ART[X.theme || "western"] || {};
    return `<div class="wx-posters">${["mvp", "dud", "luckiest", "robbed"].filter(k => X.awards[k]).map((k, i) => {
      const tk = X.awards[k], w = W[k] || {};
      return `<figure class="wx-poster ${k}" style="--tilt:${[-1.2, 0.9, -0.6, 1.3][i]}deg">
        <span class="wx-pk">${esc(T.posted)}</span>
        <div class="wx-art">${art[k] || ""}</div>
        ${T.sub ? `<span class="wx-ps">${esc(T.sub)}</span>` : ""}
        <span class="wx-pt">${esc(w.title || T[k])}</span>
        <b class="wx-pn">${nm(tk)}</b><span class="wx-pm">${mg(tk)}</span>
        <p>${ink(w.line || "")}</p>
        <div class="wx-pins">${pins(w.pins)}</div>
        <span class="wx-reward">${esc(T.reward)}: <b>${esc(w.reward || "bragging rights")}</b></span></figure>`;
    }).join("")}</div>`;
  },
  // Results: just who was standing
  results() {
    return `<div class="wx-board">${X.games.slice().sort((a, b) => a.a.localeCompare(b.a, undefined, {numeric: true})).map(g => {
      const [a, b] = g.final;
      const side = (tk, sc, other) => `<div class="wx-bs${sc > other ? " won" : ""}"><b>${nm(tk)}</b><span>${sc}</span></div>`;
      return `<div class="wx-bout">${side(g.a, a, b)}${side(g.b, b, a)}${g.final[2] ? `<small>${g.final[2]} tied</small>` : ""}</div>`;
    }).join("")}</div>`;
  },
  // Late drama: stories, with the score trail and player lines as pins
  late() {
    const L = C.late || {};
    const lates = X.games.filter(g => L[`${g.a}|${g.b}`] || (!X.copy && g.swing >= 1));
    return lates.length ? `<div class="wx-late">${lates.map(g => {
      const c = L[`${g.a}|${g.b}`], n = g.trail.length;
      const trail = g.trail.slice(Math.max(0, n - 3)).map((s, i) => `<span class="wx-pin plain"><i>${DAYS[new Date(X.days[n - 3 + i] + "T12:00:00").getDay()]}</i> <b>${score(s)}</b></span>`).join("");
      return `<div class="wx-card"><h4>${nm(g.a)} <span>vs</span> ${nm(g.b)}</h4>
        <p>${ink(txt(c) || autoLate(g))}</p><div class="wx-pins">${trail}${pins(pinsOf(c))}</div></div>`;
    }).join("")}</div>` : "";
  },
  // Injuries: tombstones
  boot() {
    const I = X.injuries.filter(i => i.still_out).slice(0, 10);
    return `<div class="wx-stones">${I.map(i => `<div class="wx-stone${i.started_hurt ? " hurt" : ""}">
      <span class="wx-rip">${esc((T.status || {})[i.status] || i.status)}</span>
      <mark>${esc(i.name)}</mark><small><b>${nm(i.team)}</b></small>
      ${i.started_hurt ? `<em>In the starting lineup</em>` : i.last_game && X.days.slice(-2).includes(i.last_game) ? `<em>Went down this weekend</em>` : ""}</div>`).join("")}</div>`;
  },
  // Rest of year: one compact board, best odds first
  roy() {
    return `<div class="wx-roy">${X.outlook.map((o, i) => {
      const mv = o.odds_move, arrow = mv == null || Math.abs(mv) < .005 ? "" : `<i class="${mv > 0 ? "up" : "dn"}">${mv > 0 ? "▲" : "▼"} ${Math.round(Math.abs(mv) * 100)}</i>`;
      const tier = o.odds >= .75 ? "good" : o.odds <= .25 ? "bad" : "mid";
      return `<div class="wx-row"><span class="wx-rk">${i + 1}</span>
        <div class="wx-tm"><b>${nm(o.team)}</b><small>${mg(o.team)} · ${o.w}-${o.l}${o.t ? "-" + o.t : ""} this week</small></div>
        <div class="wx-proj"><small>Yahoo projects</small><b>${ordinal(o.proj_rank)}</b></div>
        <div class="wx-od"><span class="wx-odds ${tier}">${pct(o.odds)}</span>${arrow}</div></div>`;
    }).join("")}</div>`;
  },
  // Overheard: one short line per manager, small type, no pins
  saloon() {
    const Z = C.zingers || {};
    return `<ul class="wx-heard">${Object.keys(X.teams).map(tk => `<li><b>${mg(tk)}</b> ${ink(txt(Z[tk]) || autoZing(tk))}</li>`).join("")}</ul>`;
  }
};

function load(w) {
  const url = w ? `data/wraps/week-${w}.json` : "data/wrap.json";
  return getJSON(url).then(x => { X = x; X.pins = X.pins || {}; render(); }).catch(() => {
    $("wx-head").textContent = "No wrap yet";
    $("wx-deck").textContent = "The first Weekly Wrap prints the Monday after Week 1 ends.";
  });
}

function posse() {
  $("wx-goons").innerHTML = Array.from({length: 12}, (_, i) => goon(i)).join("");  // goon() lives in common.js
}

function render() {
  C = X.copy || {};
  const th = X.theme || "western";
  T = Object.assign({}, THEME._, THEME[th] || {});
  const S = Object.assign({}, T, C.sections || {});
  $("wx").dataset.wt = th;
  posse();

  $("dl2").textContent = `Week ${X.week}`;
  $("wx-ear1").textContent = `Week ${X.week} Final`;
  $("wx-ear2").textContent = `Games through ${md(X.end)}`;
  $("wx-edition").textContent = `${C.edition || T.edition} · Weekly Wrap`;
  $("wx-dates").textContent = `${md(X.start)} to ${md(X.end)}`;
  $("wx-kicker").textContent = C.kicker || `Week ${X.week} is final`;
  $("wx-head").innerHTML = ink(C.headline || autoHead());
  $("wx-deck").innerHTML = ink(C.deck || "");
  const hero = (ART[th] || {}).hero;
  $("wx-hero").innerHTML = hero ? `${typeof hero === "function" ? hero() : hero}<figcaption>${esc(C.hero_caption || "")}</figcaption>` : "";
  $("wx-hero").hidden = !hero;

  const chapters = C.chapters || DEFAULT_CHAPTERS.map(b => ({block: b, head: S[b] || "", text: b === "intro" ? autoLead() : []}));
  $("chapters").innerHTML = chapters.map((ch, i) => {
    const art = null;  // Parth, Oct 26: no spot art in chapters (it broke the rows); the hero engraving and the posters carry the imagery
    const fig = art ? `<figure class="wx-spot">${typeof art === "function" ? art() : art}${ch.caption ? `<figcaption>${esc(ch.caption)}</figcaption>` : ""}</figure>` : "";
    const paras = (ch.text || []).map(x => `<p>${ink(x)}</p>`).join("");
    return `<section class="wx-ch wx-ch-${esc(ch.block)}">
      <h3 class="wx-h">${esc(ch.head || "")}</h3>
      ${ch.sub ? `<p class="wx-sub">${esc(ch.sub)}</p>` : ""}
      ${fig || paras ? `<div class="wx-body${ch.block === "intro" ? " wx-lead" : ""}${fig && paras ? " has-fig" : ""}">${paras ? `<div class="wx-txt">${paras}</div>` : ""}${fig}</div>` : ""}
      ${(BLOCK[ch.block] || (() => ""))()}</section>`;
  }).join("");

  $("wx-sign").textContent = C.sign_off || "";
  $("gen").textContent = X.date ? `Games through ${md(X.date)}.` : "";
  weeks();
}

// Template fallbacks (only computed facts) for weeks without written copy
function autoHead() {
  const a = X.awards;
  return `${X.teams[a.mvp]?.name || "Someone"} Runs the Table. ${X.teams[a.dud]?.name || "Someone"} Runs Away.`;
}
function autoLead() {
  return X.games.slice(0, 3).map(g => `${X.teams[g.a].name} ${g.final[0]}, ${X.teams[g.b].name} ${g.final[1]}${g.final[2] ? ` (${g.final[2]} tied)` : ""}.`);
}
function autoLate(g) {
  return `${X.teams[g.a].name} and ${X.teams[g.b].name} went from ${score(g.before)} to ${score(g.final)} over the last two days.`;
}
function autoZing(tk) {
  const o = X.outlook.find(o => o.team === tk) || {};
  return `${o.w}-${o.l} this week, projected ${ordinal(o.proj_rank)} the rest of the way, ${X.moves[tk] || 0} moves made.`;
}

function weeks() {
  getJSON("data/wraps/index.json").then(ws => {
    $("wx-weeks").innerHTML = ws.length > 1 ? ws.slice().reverse().map(w => `<a href="#${w}"${w === X.week ? ' aria-current="page"' : ""}>Wk ${w}</a>`).join("") : "";
  }).catch(() => {});
}

load(parseInt(location.hash.slice(1)) || null);
window.addEventListener("hashchange", () => load(parseInt(location.hash.slice(1)) || null));
</script>
